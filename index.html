<!DOCTYPE html>
<html lang="uz" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hadislar Kutubxonasi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'sans-serif'],
                        arabic: ['Amiri', 'serif'],

</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans transition-colors duration-300">

    <!-- APPLIKATSIYA KONTEYNERI -->

        <!-- YUQORI HEADER -->

                <div class="w-9 h-9 rounded-xl bg-emerald-500/10 dark:bg-emerald-500/20 flex items-center justify-center text-emerald-600 dark:text-emerald-400">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold leading-none text-slate-800 dark:text-slate-100">Hadislar</h1>
                    <span class="text-[10px] text-slate-400 dark:text-slate-500 font-medium">Sahih to'plamlar</span>

            <!-- Kun/Tun rejimi tugmasi -->

            </button>
        </header>

        <!-- BREADCRUMB -->
        <div id="breadcrumb" class="px-4 py-2 bg-slate-50 dark:bg-slate-900/50 border-b border-slate-100 dark:border-slate-800 text-xs text-slate-400 flex items-center gap-1.5 overflow-x-auto whitespace-nowrap custom-scroll">
            <span onclick="goHome()" class="cursor-pointer hover:text-emerald-500">Bosh sahifa</span>
        </div>

        <!-- ASOSIY MAZMUN QISMI -->
        <main class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4 pb-24">

            <!-- 1. BOSH SAHIFA / KITOOBLAR RO'YXATI VIEW -->
            <section id="viewBooks" class="space-y-4">
                
                <!-- TASODIFIY HADIS BLOKI (RANDOM HADITH) -->
                <div class="bg-gradient-to-br from-emerald-600 via-teal-700 to-emerald-800 dark:from-emerald-950 dark:via-teal-950 dark:to-slate-900 border border-emerald-500/20 rounded-2xl p-4 text-white shadow-lg relative overflow-hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/10 text-[11px] font-medium backdrop-blur-md">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-300"></i> Kun hadisi
                        </span>
                        <button onclick="loadRandomHadith()" class="p-1 rounded-lg bg-white/10 hover:bg-white/20 active:scale-95 transition text-xs flex items-center gap-1">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Yana
                        </button>
                    </div>

                    <div id="randomHadithCard">
                        <div class="animate-pulse space-y-2 py-4">
                            <div class="h-4 bg-white/20 rounded w-3/4"></div>
                            <div class="h-4 bg-white/20 rounded w-1/2"></div>
                        </div>
                    </div>
                </div>

                <!-- KATEGORIYALAR -->
                <div class="space-y-5">
                    <!-- OLTIN SILSILA KATEGORIYASI -->
                    <div>
                        <div class="flex items-center justify-between pt-2 mb-3">
                            <div class="flex items-center gap-2">
                                <span class="w-1.5 h-5 bg-amber-500 rounded-full"></span>
                                <h2 class="text-base font-bold text-slate-800 dark:text-slate-100">Oltin silsila</h2>
                            </div>
                            <span class="text-xs text-slate-400 font-medium" id="goldenCount"></span>
                        </div>

                    </div>

                    <!-- BOSHQA HADISLAR KATEGORIYASI -->

                    <!-- 40 HADIS KATEGORIYASI -->
                    <div>
                        <div class="flex items-center justify-between pt-2 mb-3">

                                <h2 class="text-base font-bold text-slate-800 dark:text-slate-100">40 Hadis to'plami</h2>
                            </div>

                        </div>
                        <div id="booksListForties" class="space-y-3">

                </div>
            </section>

            <!-- 2. BOBLAR GRID VIEW -->

            </section>

            <!-- 3. HADISLAR RO'YXATI VIEW -->
            <section id="viewHadiths" class="hidden space-y-4">
                <div class="relative">
                    <input type="text" id="searchInput" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:border-emerald-500 transition" placeholder="Hadis matni yoki raqami bo'yicha..." oninput="filterHadiths()">

                <div>
                    <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100" id="selectedBookTitle">Hadislar</h2>
                    <p class="text-xs text-slate-400" id="totalCount"></p>
                </div>

                <div id="hadithsList" class="space-y-3">

                <button id="loadMoreBtn" class="w-full py-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 font-semibold text-sm hidden active:scale-95 transition" onclick="loadMore()">Ko'proq ko'rsatish</button>

        </main>

        <!-- OSTKI AMALIY MENYU (BOTTOM NAVIGATION) -->
        <nav class="absolute bottom-0 left-0 right-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200/80 dark:border-slate-800/80 px-2 py-2">
            <div class="grid grid-cols-5 gap-1">
                
                <button onclick="goHome()" class="nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition active:scale-90">
                    <i data-lucide="layout-grid" class="w-5 h-5 mb-0.5"></i>
                    <span class="text-[10px] font-medium leading-none">Bosh Menu</span>
                </button>

                <button class="nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition active:scale-90">
                    <i data-lucide="book-open" class="w-5 h-5 mb-0.5"></i>
                    <span class="text-[10px] font-medium leading-none">Qur'on</span>
                </button>

                <button onclick="goHome()" class="nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-emerald-600 dark:text-emerald-400 transition active:scale-90">
                    <i data-lucide="scroll" class="w-5 h-5 mb-0.5"></i>
                    <span class="text-[10px] font-semibold leading-none">Hadislar</span>
                </button>

                <button class="nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition active:scale-90">
                    <i data-lucide="bookmark" class="w-5 h-5 mb-0.5"></i>
                    <span class="text-[10px] font-medium leading-none">Tafsirlar</span>
                </button>

                <button class="nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition active:scale-90">
                    <i data-lucide="library" class="w-5 h-5 mb-0.5"></i>
                    <span class="text-[10px] font-medium leading-none">Kutubxona</span>
                </button>

            </div>
        </nav>

    </div>

    <!-- JAVASCRIPT INTEGRATSIYASI -->
    <script>
        const SITE_URL = "https://hadis.aloshiy.com";

        // KITOBLAR RO'YXATI
        const books = [
            // OLTIN SILSILA - the_9_books
            { id: 1, nameUz: "Sahihul Buxoriy", author: "Imom Buxoriy", category: "golden", file: "db/by_book/the_9_books/bukhari.json", chaptersCount: 98, color: "from-emerald-600 to-teal-800" },
            { id: 2, nameUz: "Sahihi Muslim", author: "Imom Muslim", category: "golden", file: "db/by_book/the_9_books/muslim.json", chaptersCount: 57, color: "from-blue-600 to-indigo-800" },
            { id: 3, nameUz: "Sunani Abu Dovud", author: "Imom Abu Dovud", category: "golden", file: "db/by_book/the_9_books/abudawud.json", chaptersCount: 43, color: "from-amber-600 to-orange-800" },
            { id: 4, nameUz: "Jomi'u at-Tirmiziy", author: "Imom at-Tirmiziy", category: "golden", file: "db/by_book/the_9_books/tirmidhi.json", chaptersCount: 49, color: "from-rose-600 to-pink-800" },
            { id: 5, nameUz: "Sunani an-Nasa'iy", author: "Imom an-Nasa'iy", category: "golden", file: "db/by_book/the_9_books/nasai.json", chaptersCount: 52, color: "from-green-600 to-emerald-800" },
            { id: 6, nameUz: "Sunani Ibn Majah", author: "Imom Ibn Majah", category: "golden", file: "db/by_book/the_9_books/ibnmajah.json", chaptersCount: 37, color: "from-purple-600 to-indigo-800" },
            { id: 7, nameUz: "Muvatto Malik", author: "Imom Malik", category: "golden", file: "db/by_book/the_9_books/malik.json", chaptersCount: 61, color: "from-fuchsia-600 to-pink-800" },
            { id: 8, nameUz: "Musnad Ahmad", author: "Imom Ahmad", category: "golden", file: "db/by_book/the_9_books/ahmed.json", chaptersCount: 30, color: "from-slate-600 to-slate-800" },
            { id: 9, nameUz: "Sunani ad-Darimiy", author: "Imom ad-Darimiy", category: "golden", file: "db/by_book/the_9_books/darimi.json", chaptersCount: 24, color: "from-lime-600 to-green-800" },

            // BOSHQA HADISLAR - other_books
            { id: 15, nameUz: "Al-Adab al-Mufrad", author: "Imom Buxoriy", category: "other", file: "db/by_book/other_books/aladab_almufrad.json", chaptersCount: 57, color: "from-teal-600 to-cyan-800" },
            { id: 16, nameUz: "Riyazus Solihin", author: "Imom an-Navaviy", category: "other", file: "db/by_book/other_books/riyad_assalihin.json", chaptersCount: 20, color: "from-sky-600 to-blue-800" },
            { id: 17, nameUz: "Bulg' al-Marom", author: "Ibn Hajar al-Asqaloniy", category: "other", file: "db/by_book/other_books/bulugh_almaram.json", chaptersCount: 16, color: "from-indigo-600 to-violet-800" },
            { id: 18, nameUz: "Mishkot al-Masobih", author: "Imom at-Tabriziy", category: "other", file: "db/by_book/other_books/mishkat_almasabih.json", chaptersCount: 29, color: "from-violet-600 to-purple-800" },
            { id: 19, nameUz: "Shamoil Muhammadiya", author: "Imom at-Tirmiziy", category: "other", file: "db/by_book/other_books/shamail_muhammadiya.json", chaptersCount: 56, color: "from-pink-600 to-rose-800" },

            // 40 HADIS - forties
            { id: 10, nameUz: "Al-Arba'in an-Navaviy", author: "Imom an-Navaviy", category: "forties", file: "db/by_book/forties/nawawi40.json", chaptersCount: 1, color: "from-yellow-600 to-amber-800" },
            { id: 11, nameUz: "Al-Arba'in al-Qudsiya", author: "Hadis Qudsiy", category: "forties", file: "db/by_book/forties/qudsi40.json", chaptersCount: 1, color: "from-orange-600 to-red-800" },
            { id: 12, nameUz: "Al-Arba'in Shah Valiyulloh", author: "Shoh Valiyulloh", category: "forties", file: "db/by_book/forties/shahwaliullah40.json", chaptersCount: 1, color: "from-cyan-600 to-sky-800" }
        ];

        let currentBook = null;
        let currentHadiths = [];
        let filteredHadiths = [];
        let rawBookData = null;
        let displayedCount = 0;
        let currentRandomHadithData = null;
        const PAGE_SIZE = 30;

        function init() {
            lucide.createIcons();
            renderBooksList();
            loadRandomHadith();
        }

        function renderBooksList() {
            // Kategoriyalarga ajratish
            const goldenBooks = books.filter(b => b.category === 'golden');
            const otherBooks = books.filter(b => b.category === 'other');
            const fortiesBooks = books.filter(b => b.category === 'forties');

            // Hisoblagichlarni yangilash
            document.getElementById('goldenCount').innerText = `${goldenBooks.length} ta kitob`;
            document.getElementById('otherCount').innerText = `${otherBooks.length} ta kitob`;
            document.getElementById('fortiesCount').innerText = `${fortiesBooks.length} ta kitob`;

            // Oltin silsila
            const goldenContainer = document.getElementById('booksListGolden');
            goldenContainer.innerHTML = '';
            goldenBooks.forEach(book => {
                goldenContainer.appendChild(createBookCard(book));
            });

            // Boshqa hadislar
            const otherContainer = document.getElementById('booksListOther');
            otherContainer.innerHTML = '';
            otherBooks.forEach(book => {
                otherContainer.appendChild(createBookCard(book));
            });

            // 40 hadis
            const fortiesContainer = document.getElementById('booksListForties');
            fortiesContainer.innerHTML = '';
            fortiesBooks.forEach(book => {
                fortiesContainer.appendChild(createBookCard(book));
            });

            lucide.createIcons();
        }

        function createBookCard(book) {
            const card = document.createElement('div');
            card.className = 'bg-slate-50 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-3.5 flex flex-col gap-3 transition hover:border-emerald-500/40';
            card.innerHTML = `
                <div class="flex gap-3 items-center">
                    <div class="w-14 h-18 bg-gradient-to-br ${book.color} rounded-xl border border-white/20 flex flex-col items-center justify-center text-white text-center p-1 shadow-md shrink-0">
                        <i data-lucide="book" class="w-5 h-5 mb-1 opacity-80"></i>
                        <span class="font-arabic text-[10px] leading-tight opacity-90">${book.nameUz}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-base font-bold text-slate-800 dark:text-slate-100 truncate">${book.nameUz}</h3>
                        <p class="text-xs text-slate-400 mb-1">${book.author}</p>
                        <span class="inline-block px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-[11px] font-medium">${book.chaptersCount} ta bo'lim</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100 dark:border-slate-800/60">
                    <button onclick="openBook(${book.id}, false)" class="py-2 px-3 rounded-xl bg-emerald-500 text-white font-semibold text-xs flex items-center justify-center gap-1.5 active:scale-95 transition">
                        <i data-lucide="book-open" class="w-3.5 h-3.5"></i> O'qish
                    </button>
                    <button onclick="openBook(${book.id}, true)" class="py-2 px-3 rounded-xl bg-slate-200/60 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-xs flex items-center justify-center gap-1.5 active:scale-95 transition">
                        Bo'limlar <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `;
            return card;
        }

        // BOSH SAHIFA UCHUN TASODIFIY HADIS OLGUCHI FUNKSIYA
        async function loadRandomHadith() {
            const cardContainer = document.getElementById('randomHadithCard');
            cardContainer.innerHTML = `
                <div class="animate-pulse space-y-2 py-4">
                    <div class="h-4 bg-white/20 rounded w-3/4"></div>
                    <div class="h-4 bg-white/20 rounded w-1/2"></div>
                </div>
            `;

            try {
                // Tasodifiy kitob tanlash
                const randomBook = books[Math.floor(Math.random() * books.length)];
                const res = await fetch(randomBook.file);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                const list = data.hadiths || (Array.isArray(data) ? data : Object.values(data));
                
                // Tasodifiy hadis tanlash
                const randomIndex = Math.floor(Math.random() * list.length);
                const item = list[randomIndex];
                const hadithNo = item.idInBook || (randomIndex + 1);

                const arabicText = item.arabic || '';
                const englishText = item.english?.text || (typeof item.english === 'string' ? item.english : '');
                const narrator = item.english?.narrator || '';

                // Nusxalash va bo'lishish uchun ma'lumot saqlab qo'yamiz
                currentRandomHadithData = {
                    author: randomBook.author,
                    bookName: randomBook.nameUz,
                    hadithNo: hadithNo,
                    arabic: arabicText,
                    english: englishText,
                    narrator: narrator
                };

                cardContainer.innerHTML = `
                    <div class="space-y-2.5 my-2">
                        ${arabicText ? `<div class="font-arabic text-base leading-relaxed text-right dir-rtl opacity-95 bg-black/10 p-2.5 rounded-xl" dir="rtl">${arabicText}</div>` : ''}
                        <div class="text-xs text-emerald-50 leading-relaxed line-clamp-4">
                            ${narrator ? `<span class="font-bold text-amber-200">${narrator}</span> ` : ''}${englishText}
                        </div>
                    </div>
                    
                    <!-- MANBA QISMI -->
                    <div class="pt-2 mt-2 border-t border-white/10 flex justify-between items-center text-[11px] text-emerald-100 font-medium">
                        <span class="flex items-center gap-1">
                            <i data-lucide="bookmark-check" class="w-3.5 h-3.5 text-amber-300"></i> ${randomBook.nameUz}, #${hadithNo}-hadis
                        </span>
                        
                        <div class="flex gap-1.5">
                            <button onclick="copyRandomHadith()" class="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/20 active:scale-95 transition flex items-center gap-1">
                                <i data-lucide="copy" class="w-3 h-3"></i>
                            </button>
                            <button onclick="shareRandomHadith()" class="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/20 active:scale-95 transition flex items-center gap-1">
                                <i data-lucide="share-2" class="w-3 h-3"></i>
                            </button>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            } catch (err) {
                cardContainer.innerHTML = `<p class="text-xs text-amber-200 py-2">Hadisni yuklashda kichik uzilish bo'ldi. Yana bir bor urinib ko'ring.</p>`;
            }
        }

        function buildRandomHadithText() {
            if (!currentRandomHadithData) return '';
            const d = currentRandomHadithData;
            const ar = d.arabic ? `${d.arabic}\n\n` : '';
            const nar = d.narrator ? `${d.narrator}\n` : '';
            return `${d.author} #${d.hadithNo}\n\n${ar}${nar}${d.english}\n\nManba: ${d.bookName}, #${d.hadithNo}-hadis.\n\nVisit: ${SITE_URL}`;
        }

        function copyRandomHadith() {
            const text = buildRandomHadithText();
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                alert("Hadis va manba nusxalandi!");
            });
        }

        async function shareRandomHadith() {
            const text = buildRandomHadithText();
            if (!text) return;

            const shareData = {
                title: `${currentRandomHadithData.author} #${currentRandomHadithData.hadithNo}`,
                text: text
            };

            if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    if (err.name !== 'AbortError') copyRandomHadith();
                }
            } else {
                copyRandomHadith();
            }
        }

        async function openBook(bookId, showChaptersOnly = false) {
            currentBook = books.find(b => b.id === bookId);
            showLoading(true);

            try {
                const res = await fetch(currentBook.file);
                if (!res.ok) throw new Error("Faylni yuklab bo'lmadi");
                rawBookData = await res.json();

                const rawHadiths = rawBookData.hadiths || (Array.isArray(rawBookData) ? rawBookData : Object.values(rawBookData));
                currentHadiths = rawHadiths.map((item, index) => ({
                    ...item,
                    bookHadithNo: item.idInBook || (index + 1)
                }));

                if (showChaptersOnly) {
                    renderChaptersView();
                } else {
                    showAllHadithsOfBook();
                }
            } catch (err) {
                alert("Xatolik: Fayl yuklanmadi!");
            } finally {
                showLoading(false);
            }
        }

        function renderChaptersView() {
            document.getElementById('chaptersBookTitle').innerText = currentBook.nameUz + " — Boblar";
            const container = document.getElementById('chaptersGrid');
            container.innerHTML = '';

            let chaptersList = rawBookData.chapters || [];

            if (chaptersList.length === 0) {
                const chapterIds = [...new Set(currentHadiths.map(h => h.chapterId))].sort((a,b) => a - b);
                chaptersList = chapterIds.map(id => ({ id: id, english: `Bob #${id}` }));
            }

            chaptersList.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'bg-slate-50 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 rounded-xl p-3 cursor-pointer hover:border-emerald-500/50 transition active:scale-95';
                card.onclick = () => filterHadithsByChapter(ch.id);
                card.innerHTML = `
                    <div class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 mb-0.5">Bob ${ch.id}</div>
                    <div class="text-xs font-semibold text-slate-700 dark:text-slate-200 line-clamp-2">${ch.english?.title || ch.english || ch.arabic || ('Bob ' + ch.id)}</div>
                `;
                container.appendChild(card);
            });

            showView('viewChapters');
            updateBreadcrumb([currentBook.nameUz, 'Boblar']);
        }

        function filterHadithsByChapter(chapterId) {
            filteredHadiths = currentHadiths.filter(h => h.chapterId === chapterId);
            document.getElementById('selectedBookTitle').innerText = `${currentBook.nameUz} — Bob ${chapterId}`;
            document.getElementById('totalCount').innerText = `Ushbu bobda ${filteredHadiths.length} ta hadis bor`;

            displayedCount = 0;
            showView('viewHadiths');
            updateBreadcrumb([currentBook.nameUz, `Bob ${chapterId}`]);
            
            document.getElementById('hadithsList').innerHTML = '';
            loadMore();
        }

        function showAllHadithsOfBook() {
            filteredHadiths = currentHadiths;
            document.getElementById('selectedBookTitle').innerText = currentBook.nameUz;
            document.getElementById('totalCount').innerText = `Jami hadislar: ${currentHadiths.length} ta`;

            displayedCount = 0;
            showView('viewHadiths');
            updateBreadcrumb([currentBook.nameUz]);

            document.getElementById('hadithsList').innerHTML = '';
            loadMore();
        }

        function renderNextBatch(list) {
            const container = document.getElementById('hadithsList');

            list.forEach((item, index) => {
                const currentIndex = displayedCount - list.length + index;
                const card = document.createElement('div');
                card.className = 'bg-slate-50 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 space-y-3';
                
                const arabicText = item.arabic || '';
                const englishText = item.english?.text || (typeof item.english === 'string' ? item.english : '');
                const narrator = item.english?.narrator || '';

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2 text-xs font-semibold text-emerald-600 dark:text-emerald-400">
                        <span>Hadis #${item.bookHadithNo}</span>
                        <span>Bob: ${item.chapterId || 1}</span>
                    </div>
                    ${arabicText ? `<div class="font-arabic text-lg leading-loose text-right dir-rtl bg-emerald-500/5 p-3 rounded-xl text-slate-800 dark:text-slate-100" dir="rtl">${arabicText}</div>` : ''}
                    <div class="text-xs leading-relaxed text-slate-600 dark:text-slate-300">
                        ${narrator ? `<div class="font-bold text-emerald-600 dark:text-emerald-400 mb-1">${narrator}</div>` : ''}
                        <div>${englishText}</div>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800/60">
                        <span class="text-[11px] text-slate-400 font-medium">${currentBook?.nameUz || 'Manba'}</span>
                        <div class="flex gap-2">
                            <button onclick="copyFormattedHadith(${currentIndex})" class="px-3 py-1.5 rounded-lg bg-slate-200/60 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-medium flex items-center gap-1 hover:text-emerald-500 transition active:scale-95">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i> Nusxalash
                            </button>
                            <button onclick="shareHadith(${currentIndex})" class="px-3 py-1.5 rounded-lg bg-slate-200/60 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-medium flex items-center gap-1 hover:text-emerald-500 transition active:scale-95">
                                <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Bo'lishish
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();

            const loadBtn = document.getElementById('loadMoreBtn');
            if (displayedCount < filteredHadiths.length) {
                loadBtn.classList.remove('hidden');
            } else {
                loadBtn.classList.add('hidden');
            }
        }

        function loadMore() {
            const nextBatch = filteredHadiths.slice(displayedCount, displayedCount + PAGE_SIZE);
            displayedCount += nextBatch.length;
            renderNextBatch(nextBatch);
        }

        function buildFormattedTextByIndex(index) {
            const item = filteredHadiths[index];
            if (!item) return '';

            const authorName = currentBook ? currentBook.author : 'Hadis';
            const bookName = currentBook ? currentBook.nameUz : '';
            const arabic = item.arabic ? `${item.arabic}\n\n` : '';
            const english = item.english?.text || (typeof item.english === 'string' ? item.english : '');
            const narrator = item.english?.narrator ? item.english.narrator + '\n' : '';

            return `${authorName} #${item.bookHadithNo}\n\n${arabic}${narrator}${english}\n\nManba: ${bookName}, #${item.bookHadithNo}-hadis.\n\nVisit: ${SITE_URL}`;
        }

        function copyFormattedHadith(index) {
            const fullText = buildFormattedTextByIndex(index);
            if (!fullText) return;

            navigator.clipboard.writeText(fullText).then(() => {
                alert("Hadis nusxalandi!");
            });
        }

        async function shareHadith(index) {
            const item = filteredHadiths[index];
            const fullText = buildFormattedTextByIndex(index);
            if (!fullText) return;

            const shareData = {
                title: `${currentBook?.author || 'Hadis'} #${item?.bookHadithNo}`,
                text: fullText
            };

            if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    if (err.name !== 'AbortError') copyFormattedHadith(index);
                }
            } else {
                copyFormattedHadith(index);
            }
        }

        function filterHadiths() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            document.getElementById('hadithsList').innerHTML = '';
            displayedCount = 0;

            if (!query) {
                filteredHadiths = currentHadiths;
            } else {
                filteredHadiths = currentHadiths.filter(item => {
                    const ar = (item.arabic || '').toLowerCase();
                    const en = (item.english?.text || '').toLowerCase();
                    const num = String(item.bookHadithNo);
                    return ar.includes(query) || en.includes(query) || num === query;
                });
            }

            document.getElementById('totalCount').innerText = `Topildi: ${filteredHadiths.length} ta hadis`;
            loadMore();
        }

        function showView(viewId) {
            document.getElementById('viewBooks').classList.add('hidden');
            document.getElementById('viewChapters').classList.add('hidden');
            document.getElementById('viewHadiths').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
            document.querySelector('main').scrollTop = 0;
        }

        function goHome() {
            showView('viewBooks');
            updateBreadcrumb([]);
            document.getElementById('searchInput').value = '';
            loadRandomHadith(); // Bosh sahifaga qaytganda tasodifiy hadisni yangilash
        }

        function updateBreadcrumb(paths) {
            const bc = document.getElementById('breadcrumb');
            if (paths.length === 0) {
                bc.innerHTML = '<span onclick="goHome()" class="cursor-pointer hover:text-emerald-500">Bosh sahifa</span>';
            } else {
                let html = '<span onclick="goHome()" class="cursor-pointer hover:text-emerald-500">Bosh sahifa</span>';
                paths.forEach(p => {
                    html += ` <i data-lucide="chevron-right" class="w-3 h-3 inline"></i> <span class="text-slate-600 dark:text-slate-300 font-medium">${p}</span>`;
                });
                bc.innerHTML = html;
                lucide.createIcons();
            }
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        // KUN / TUN REJIMINI BOSHQARISH
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });

        init();
    </script>
</body>
</html>
