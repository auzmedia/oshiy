<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <!-- Mobil qurilmalarda va Telegram ichida to'g'ri ko'rinishi uchun juda muhim -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qur'on va Hadis To'plami</title>
    
    <!-- Telegram Mini App bilan ishlash uchun rasmiy kutubxona -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Dizayn faylimizni ulash -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Yuqori qism (Sarlavha va kutib olish) -->
    <div class="header">
        <h1>📖 Islomiy To'plam</h1>
        <p id="user-greeting">Xush kelibsiz!</p>
    </div>

    <!-- Asosiy kontent qismi -->
    <div class="content">
        
        <!-- Tayyor tugmalar (Kartochkalar) -->
        <div class="card" onclick="sendToBot('Fotiha surasi tafsirini qisqacha yozib ber')">
            <h3>📜 Fotiha surasi</h3>
            <p>O'qish va tafsirini bilish</p>
        </div>
        
        <div class="card" onclick="sendToBot('Imom Buxoriyning niyat haqidagi birinchi hadisini tarjimasi bilan yozib ber')">
            <h3>🕌 Sahihi Buxoriy</h3>
            <p>"Innamal a'molu bin-niyyat" hadisi va sharhi</p>
        </div>

        <div class="card" onclick="sendToBot('Oyatul Kursiy o\'qilishi va o\'zbekcha ma\'nosi')">
            <h3>✨ Oyatul Kursiy</h3>
            <p>O'qilishi va o'zbekcha tarjimasi</p>
        </div>

        <!-- Foydalanuvchi o'zi ma'lumot kiritadigan qism -->
        <div class="input-section">
            <textarea id="custom-text" placeholder="Tarjima yoki tafsir qilish uchun arabcha matn, sura yoki hadis nomini kiriting..."></textarea>
            <button onclick="translateCustomText()">Tarjima va Tafsir qilish</button>
        </div>
        
    </div>

    <!-- Mantiq va Telegram botga yuborish faylimizni ulash -->
    <script src="app.js"></script>
</body>
</html>
